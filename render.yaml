services:
  - type: web
    name: ask-me-chatbot
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile

    # Docker mode uses entrypoint.sh (collectstatic + migrate + gunicorn) -
    # buildCommand/startCommand are for the native python env and are
    # ignored/unnecessary here.

    envVars:
      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        value: ".onrender.com"

      - key: TIME_ZONE
        value: "Asia/Kolkata"

      - key: PYTESSERACT_CMD
        value: "/usr/bin/tesseract"

      # 👇 You must set these in the Render dashboard (not in the yaml)
      # - DATABASE_URL
      # - EMAIL_HOST_PASSWORD
      # - GEMINI_API_KEY
      # - EMAIL_HOST_USER
      # - CSRF_TRUSTED_ORIGINS  (e.g. https://ask-me-smart-document-assistant.onrender.com)
