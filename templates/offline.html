{% extends "base.html" %}
{% load static %}

{% block content %}
<main class="min-h-[calc(100vh-80px)] flex items-center justify-center px-4">
    <div class="text-center max-w-lg">
        <div class="text-6xl mb-6">📡</div>
        <h1 class="text-3xl font-bold text-gray-800 dark:text-white mb-4">
            You're Offline
        </h1>
        <p class="text-gray-600 dark:text-gray-400 mb-8">
            Don't worry! You can still access your documents offline.<br>
            Once you're back online, all changes will sync automatically.
        </p>
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a href="{% url 'core:document_library' %}" 
               class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold transition">
                📄 View Documents
            </a>
            <button onclick="window.location.reload()" 
                    class="px-6 py-3 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-800 dark:text-white rounded-xl font-semibold transition">
                🔄 Retry Connection
            </button>
        </div>
    </div>
</main>
{% endblock %}
