{% extends "base.html" %} {% load static %} {% block content %}

<main
  class="min-h-[calc(100vh-80px)] flex items-center justify-center px-4 py-8 bg-gray-50 dark:bg-gray-900"
>
  <div class="w-full max-w-md">
    <div
      class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-6 md:p-8 border border-gray-200 dark:border-gray-700 text-center"
    >
      <h2 class="text-2xl font-bold text-gray-800 dark:text-white mb-4">
        ✅ Password Reset Complete
      </h2>
      <p class="text-gray-600 dark:text-gray-400 leading-relaxed">
        Your password has been set successfully. You may now
        <a
          href="{% url 'account:login' %}"
          class="text-indigo-600 dark:text-indigo-400 font-semibold hover:underline"
          >log in</a
        >
        with your new credentials.
      </p>
    </div>
  </div>
</main>

{% endblock %}
