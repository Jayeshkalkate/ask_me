{% extends "base.html" %} {% load static %} {% block content %}

<main
  class="min-h-[calc(100vh-80px)] flex items-center justify-center px-4 py-8 bg-gray-50 dark:bg-gray-900"
>
  <div class="w-full max-w-md">
    <div
      class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-6 md:p-8 border border-gray-200 dark:border-gray-700"
    >
      <h2
        class="text-2xl font-bold text-center text-gray-800 dark:text-white mb-4"
      >
        🔒 Forgot Your Password?
      </h2>
      <p class="text-center text-gray-600 dark:text-gray-400 mb-6">
        Enter your email address below, and we'll send you instructions to reset
        your password.
      </p>

      <form method="post" class="space-y-4">
        {% csrf_token %} {{ form.as_p }}
        <button
          type="submit"
          class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-md transition transform hover:scale-105"
        >
          📧 Send Reset Email
        </button>
      </form>
    </div>
  </div>
</main>

{% endblock %}
